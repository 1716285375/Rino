[package]
name = "rino"
version = "0.1.0"
description = "RINO: Windows IME companion for language learning"
authors = ["RINO contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "rino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Prevent a second RINO process from opening another window or tray icon.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
lru = "0.12"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
url = "2"
msedge-tts = "0.4.1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25.1", default-features = false, features = ["pattern", "control", "input"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
